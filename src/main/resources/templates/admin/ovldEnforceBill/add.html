<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('治超处理单登记')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">处理单号</label>
                    <div class="layui-input-block">
                        <input type="text" name="billNo" autocomplete="off" placeholder="处理单号" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">所属站点</label>
                    <div class="layui-input-block">
                        <select name="siteId">
                            <option th:each="site : ${siteList}" th:value="${site.id}" th:text="${site.siteName}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">超限吨位</label>
                    <div class="layui-input-block">
                        <input type="text" name="qty" autocomplete="off" placeholder="超限吨位" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">罚款金额</label>
                    <div class="layui-input-block">
                        <input type="text" placeholder="由系统按吨位折算，无需填写" class="layui-input" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <input type="text" name="remark" autocomplete="off" placeholder="备注" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="ovldEnforceBill-save">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath+"/OvldEnforceBillController";

        //登记：罚款金额由系统折算，登记结果以返回为准
        form.on('submit(ovldEnforceBill-save)', function (data) {
            let loader = layer.load();
            $.ajax({
                url: MODULE_PATH+'/register',
                data: data.field,
                dataType: 'json',
                contentType: 'application/x-www-form-urlencoded',
                type: 'post',
                success: function (result) {
                    if (result.code==200) {
                        let fineTip = result.data ? '，罚款金额：' + result.data.fineAmt : '';
                        layer.msg(result.msg + fineTip, {icon: 1, time: 1500}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                            parent.layui.table.reload("ovldEnforceBill-table");
                            layer.close(loader);
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1000});
                        layer.close(loader);
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
